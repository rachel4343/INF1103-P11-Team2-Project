services:
  phishguard-cli:
    build: .
    image: phishguard
    stdin_open: true
    tty: true
    command: python phishing_guard_main.py
    environment:
      - GEMINI_API_KEY
      - PHISHGUARD_DATA_FILE=/app/data/phishguard_reports.json
    volumes:
      - ./data:/app/data

  phishguard-web:
    build: .
    image: phishguard
    ports:
      - "8501:8501"
    command: streamlit run phishguard_main_web_app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - GEMINI_API_KEY
      - PHISHGUARD_DATA_FILE=/app/data/phishguard_reports.json
    volumes:
      - ./data:/app/data
