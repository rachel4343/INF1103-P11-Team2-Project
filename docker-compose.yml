services:
  phishguard:
    build: .
    image: phishguard
    # Needed so the menus, input() and the hidden password prompts work.
    stdin_open: true
    tty: true
    # Reports are saved next to the working directory, so work inside the
    # mounted folder and they survive after the container stops.
    working_dir: /app/data
    command: python /app/phishing_guard_main.py
    environment:
      # Passed through from your own machine. Never write the key in this file.
      - GEMINI_API_KEY
    volumes:
      - ./data:/app/data
      